<svg width="1400" height="620" viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="edgeGlowA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25dfff"/>
      <stop offset="100%" stop-color="#7a4dff"/>
    </linearGradient>

    <marker id="arrowA" viewBox="0 0 12 12" markerWidth="6" markerHeight="6" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#25dfff"/>
    </marker>

    <filter id="panelGlowA" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .panelA { fill:#0b1730; stroke:url(#edgeGlowA); stroke-width:1.6; rx:14; filter:url(#panelGlowA); }
      .smallA { fill:#10203f; stroke:url(#edgeGlowA); stroke-width:1.2; rx:10; filter:url(#panelGlowA); }
      .titleA { fill:#ffffff; font-family:Arial, Helvetica, sans-serif; font-size:20px; font-weight:700; text-anchor:middle; dominant-baseline:middle; }
      .textA { fill:#ffffff; font-family:Arial, Helvetica, sans-serif; font-size:15px; dominant-baseline:middle; }
      .miniA { fill:#d9eeff; font-family:Arial, Helvetica, sans-serif; font-size:13px; dominant-baseline:middle; }
      .lineA { stroke:#25dfff; stroke-width:2.6; fill:none; marker-end:url(#arrowA); stroke-linecap:round; }
      .ghostA { fill:#000000; opacity:.05; font-family:Arial, Helvetica, sans-serif; font-size:88px; font-weight:700; }
    </style>
  </defs>

  <!-- Clients column -->
  <rect x="50" y="70" width="260" height="68" class="panelA"/>
  <text x="180" y="98" class="titleA">Claude Desktop</text>
  <text x="82" y="122" class="miniA">SSE / POST → /babylon-scene/sse</text>

  <rect x="50" y="155" width="260" height="68" class="panelA"/>
  <text x="180" y="183" class="titleA">ChatGPT</text>
  <text x="82" y="207" class="miniA">HTTP + SSE → /babylon-scene/mcp</text>

  <rect x="50" y="240" width="260" height="68" class="panelA"/>
  <text x="180" y="268" class="titleA">VS Code Copilot</text>
  <text x="82" y="292" class="miniA">HTTP + SSE → /babylon-scene/mcp</text>

  <rect x="50" y="325" width="260" height="68" class="panelA"/>
  <text x="180" y="353" class="titleA">MCP Inspector</text>
  <text x="82" y="377" class="miniA">HTTP + SSE → /babylon-scene/mcp</text>

  <rect x="50" y="410" width="260" height="68" class="panelA"/>
  <text x="180" y="438" class="titleA">Client WS brut</text>
  <text x="82" y="462" class="miniA">WebSocket → /babylon-scene</text>

  <!-- Relay -->
  <rect x="565" y="235" width="270" height="120" class="panelA"/>
  <text x="700" y="275" class="titleA">WsTunnel</text>
  <text x="700" y="305" class="textA" text-anchor="middle">Relais Node.js</text>

  <!-- Browser -->
  <rect x="1050" y="225" width="280" height="140" class="panelA"/>
  <text x="1190" y="262" class="titleA">Navigateur</text>
  <text x="1082" y="295" class="textA">BabylonJS</text>
  <text x="1082" y="322" class="textA">McpServer</text>
  <text x="1082" y="349" class="miniA">ws://host/provider/babylon-scene</text>

  <!-- Arrows -->
  <line x1="310" y1="104" x2="550" y2="255" class="lineA"/>
  <line x1="310" y1="189" x2="550" y2="270" class="lineA"/>
  <line x1="310" y1="274" x2="550" y2="285" class="lineA"/>
  <line x1="310" y1="359" x2="550" y2="300" class="lineA"/>
  <line x1="310" y1="444" x2="550" y2="315" class="lineA"/>

  <line x1="835" y1="295" x2="1030" y2="295" class="lineA"/>

  <text x="1310" y="82" class="ghostA">4</text>
</svg>