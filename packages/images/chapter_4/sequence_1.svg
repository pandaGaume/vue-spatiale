<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25dfff"/>
      <stop offset="100%" stop-color="#7a4dff"/>
    </linearGradient>

    <marker id="arrowGlow"
            viewBox="0 0 12 12"
            markerWidth="6"
            markerHeight="6"
            refX="10"
            refY="6"
            orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#25dfff"/>
    </marker>

    <filter id="panelGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .actorPanel {
        fill:#0b1730;
        stroke:url(#edgeGlow);
        stroke-width:1.6;
        rx:12;
        filter:url(#panelGlow);
      }

      .labelPanel {
        fill:#10203f;
        stroke:url(#edgeGlow);
        stroke-width:1.25;
        rx:10;
        filter:url(#panelGlow);
      }

      .actorText {
        fill:#ffffff;
        font-family:Arial, Helvetica, sans-serif;
        font-size:18px;
        font-weight:700;
        text-anchor:middle;
        dominant-baseline:middle;
      }

      .labelText {
        fill:#ffffff;
        font-family:Arial, Helvetica, sans-serif;
        font-size:14px;
        dominant-baseline:middle;
      }

      .lifeline {
        stroke:#73dfff;
        stroke-width:2;
        stroke-dasharray:7 7;
        opacity:1;
      }

      .arrow {
        stroke:#25dfff;
        stroke-width:2.6;
        fill:none;
        marker-end:url(#arrowGlow);
        stroke-linecap:round;
      }

      .ghost {
        fill:#000000;
        opacity:.05;
        font-family:Arial, Helvetica, sans-serif;
        font-size:82px;
        font-weight:700;
      }
    </style>
  </defs>

  <!-- transparent background -->

  <!-- Actor headers -->
  <rect x="115" y="18" width="170" height="40" class="actorPanel"/>
  <rect x="515" y="18" width="170" height="40" class="actorPanel"/>
  <rect x="870" y="18" width="260" height="40" class="actorPanel"/>

  <text x="200" y="38" class="actorText">MCP Client</text>
  <text x="600" y="38" class="actorText">WsTunnel</text>
  <text x="1000" y="38" class="actorText">McpServer (browser)</text>

  <!-- Lifelines -->
  <line x1="200" y1="70" x2="200" y2="485" class="lifeline"/>
  <line x1="600" y1="70" x2="600" y2="485" class="lifeline"/>
  <line x1="1000" y1="70" x2="1000" y2="485" class="lifeline"/>

  <!-- request -->
  <line x1="200" y1="115" x2="580" y2="115" class="arrow"/>
  <rect x="330" y="87" width="88" height="26" class="labelPanel"/>
  <text x="342" y="100" class="labelText">request</text>

  <rect x="275" y="123" width="108" height="26" class="labelPanel"/>
  <text x="287" y="136" class="labelText">tools/call</text>

  <rect x="246" y="155" width="175" height="26" class="labelPanel"/>
  <text x="258" y="168" class="labelText">{ name, arguments }</text>

  <!-- ws send -->
  <line x1="600" y1="200" x2="980" y2="200" class="arrow"/>
  <rect x="720" y="172" width="90" height="26" class="labelPanel"/>
  <text x="732" y="185" class="labelText">WS send</text>

  <rect x="1012" y="186" width="158" height="26" class="labelPanel"/>
  <text x="1024" y="199" class="labelText">executeToolAsync()</text>

  <rect x="1012" y="218" width="158" height="26" class="labelPanel"/>
  <text x="1024" y="231" class="labelText">→ BabylonJS adapter</text>

  <rect x="1012" y="250" width="116" height="26" class="labelPanel"/>
  <text x="1024" y="263" class="labelText">camera moves</text>

  <!-- accepted -->
  <line x1="600" y1="285" x2="220" y2="285" class="arrow"/>
  <rect x="308" y="257" width="122" height="26" class="labelPanel"/>
  <text x="320" y="270" class="labelText">202 Accepted</text>

  <rect x="245" y="293" width="190" height="26" class="labelPanel"/>
  <text x="257" y="306" class="labelText">(SSE) or HTTP held open</text>

  <!-- ws response -->
  <line x1="1000" y1="355" x2="620" y2="355" class="arrow"/>
  <rect x="706" y="327" width="112" height="26" class="labelPanel"/>
  <text x="718" y="340" class="labelText">WS response</text>

  <!-- response -->
  <line x1="600" y1="420" x2="220" y2="420" class="arrow"/>
  <rect x="323" y="392" width="94" height="26" class="labelPanel"/>
  <text x="335" y="405" class="labelText">response</text>

  <rect x="260" y="428" width="138" height="26" class="labelPanel"/>
  <text x="272" y="441" class="labelText">{ content: [...] }</text>

  <!-- watermark -->
  <text x="1128" y="84" class="ghost">4</text>
</svg>